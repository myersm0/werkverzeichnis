# This workflow builds and releases binaries when you push a version tag
#
# To trigger a release:
#   git tag v0.4.0
#   git push origin v0.4.0

name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]+.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches crate version
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' wv/Cargo.toml | head -1)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match wv/Cargo.toml version $crate_version" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        working-directory: wv
        run: cargo test

      - name: Validate dataset
        run: cargo run --manifest-path wv/Cargo.toml -- validate --data-dir .

  create-release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

  build:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: wv
            asset_name: wv-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: wv
            asset_name: wv-macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: wv
            asset_name: wv-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: wv.exe
            asset_name: wv-windows-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        working-directory: wv
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p package/data
          cp "wv/target/${{ matrix.target }}/release/${{ matrix.artifact }}" package/
          cp -R catalogs collections composers compositions inventories schemas package/data/
          cp LICENSE.md package/data/
          tar -C package -czf "${{ matrix.asset_name }}.tar.gz" "${{ matrix.artifact }}" data
          shasum -a 256 "${{ matrix.asset_name }}.tar.gz" > "${{ matrix.asset_name }}.tar.gz.sha256"

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/data | Out-Null
          Copy-Item "wv/target/${{ matrix.target }}/release/${{ matrix.artifact }}" package/
          Copy-Item catalogs,collections,composers,compositions,inventories,schemas package/data/ -Recurse
          Copy-Item LICENSE.md package/data/
          Push-Location package
          7z a "../${{ matrix.asset_name }}.zip" "${{ matrix.artifact }}" data
          Pop-Location
          $asset = "${{ matrix.asset_name }}.zip"
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Out-File -Encoding ascii "$asset.sha256"

      - name: Upload Release Asset (Unix)
        if: matrix.os != 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "${{ matrix.asset_name }}.tar.gz" \
            "${{ matrix.asset_name }}.tar.gz.sha256" \
            --clobber

      - name: Upload Release Asset (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$env:GITHUB_REF_NAME" `
            "${{ matrix.asset_name }}.zip" `
            "${{ matrix.asset_name }}.zip.sha256" `
            --clobber
