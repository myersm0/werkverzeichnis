[package]
name = "werkverzeichnis"
version = "0.3.2"
edition = "2021"

[lib]
name = "werkverzeichnis"
path = "src/lib.rs"

[[bin]]
name = "wv"
path = "src/bin/wv.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonschema = { version = "0.49", default-features = false }
thiserror = "1.0"
regex = "1.10"
clap = { version = "4.4", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
rusqlite = { version = "0.38.0", features = ["bundled"]}

[dev-dependencies]
tempfile = "3"
